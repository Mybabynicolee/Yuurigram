name: Build Yuurigram Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: read

env:
  ANDROID_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  ANDROID_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

jobs:
  release:
    name: Assemble signed release APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.10.2"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Validate required build secrets
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$API_ID" || { echo 'Missing TELEGRAM_API_ID repository secret'; exit 1; }
          test -n "$API_HASH" || { echo 'Missing TELEGRAM_API_HASH repository secret'; exit 1; }
          test -n "$KEYSTORE_B64" || { echo 'Missing RELEASE_KEYSTORE_BASE64 repository secret'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing RELEASE_KEY_PASSWORD repository secret'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing RELEASE_KEY_ALIAS repository secret'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing RELEASE_STORE_PASSWORD repository secret'; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          install -d -m 700 TMessagesProj/config
          printf '%s' "$KEYSTORE_B64" | base64 --decode > TMessagesProj/config/release.keystore
          chmod 600 TMessagesProj/config/release.keystore

      - name: Build signed release APK and AAB
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            -PTELEGRAM_API_ID="$ANDROID_API_ID" \
            -PTELEGRAM_API_HASH="$ANDROID_API_HASH" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            :TMessagesProj_App:assembleAfatRelease \
            :TMessagesProj_App:bundleAfatRelease

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -exec cp {} release-artifacts/ \;
          find TMessagesProj_App/build/outputs/bundle -type f -name '*.aab' -exec cp {} release-artifacts/ \;
          test -n "$(find release-artifacts -type f -print -quit)"
          sha256sum release-artifacts/* | tee release-artifacts/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yuurigram-release-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
