name: Apply Yuurigram patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply patch and publish
        run: |
          set -euo pipefail
          PATCH="$(awk 'f { if ($0 ~ /^        run:/) exit; gsub(/[[:space:]]/, ""); printf "%s", $0 } /SOURCE_PATCH_B64: >-/{f=1}' bootstrap.yml)"
          printf '%s' "$PATCH" | base64 --decode | git apply --binary -
          rm -f bootstrap.yml .github/workflows/bootstrap-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Yuurigram branding, multi-account capacity, and release workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
