name: Apply Yuurigram 9999 patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply patch and publish
        run: |
          set -euo pipefail
          git apply --binary 9999.patch
          rm -f 9999.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java TMessagesProj/src/main/java/org/telegram/ui/UserInfoActivity.java
          git commit -m "Raise Yuurigram account capacity to 9999 with lazy startup"
          git push origin HEAD:${GITHUB_REF_NAME}
