name: Bootstrap Yuurigram source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply source patch
        env:
          SOURCE_PATCH_B64: >-
            
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_PATCH_B64" | base64 --decode | git apply --binary -
          rm -f bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Yuurigram branding and multi-account capacity"
          git push origin HEAD:${GITHUB_REF_NAME}
