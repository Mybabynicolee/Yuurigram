name: Bootstrap Yuurigram source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-yuurigram
  cancel-in-progress: true

jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply prepared source patch
        env:
          SOURCE_PATCH_B64: >-
            
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_PATCH_B64" | base64 --decode | git apply --binary -
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add Yuurigram branding, multi-account capacity, and release workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
