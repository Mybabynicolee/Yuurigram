name: Bootstrap Yuurigram source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.10.2"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Validate required build secrets
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$API_ID" || { echo 'Missing TELEGRAM_API_ID'; exit 1; }
          test -n "$API_HASH" || { echo 'Missing TELEGRAM_API_HASH'; exit 1; }
          test -n "$KEYSTORE_B64" || { echo 'Missing RELEASE_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing RELEASE_KEY_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing RELEASE_KEY_ALIAS'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing RELEASE_STORE_PASSWORD'; exit 1; }
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          install -d -m 700 TMessagesProj/config
          printf '%s' "$KEYSTORE_B64" | base64 --decode > TMessagesProj/config/release.keystore
          chmod 600 TMessagesProj/config/release.keystore
      - name: Apply prepared source patch
        env:
          SOURCE_PATCH_B64: >-
            
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_PATCH_B64" | base64 --decode | git apply --binary -
          rm -f bootstrap.yml .github/workflows/bootstrap-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Yuurigram branding, multi-account capacity, and release workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
